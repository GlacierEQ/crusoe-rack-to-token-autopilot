[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crusoe-rack-to-token-autopilot"
version = "1.0.0"
description = "Rack-constrained inference plan optimizer for successful tokens per kW"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rack-to-token-autopilot = "rack_to_token_cli:main"

[tool.setuptools]
py-modules = ["rack_to_token_autopilot", "rack_to_token_cli", "promotion_authority"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

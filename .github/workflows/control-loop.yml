name: Autopilot Control Loop

on:
  push:
  pull_request:

jobs:
  control-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Compile control surfaces
        run: |
          python -m py_compile src/rack_token_controller.py
          python -m py_compile src/autopilot_loop.py
      - name: Prove control-loop behavior
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_autopilot_loop.py

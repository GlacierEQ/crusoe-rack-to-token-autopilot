name: tests
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/operate.py
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip wheel . --no-deps -w dist
      - run: python -m pip install --force-reinstall dist/*.whl
      - name: Installed plan optimizer
        run: rack-to-token-autopilot > /tmp/plan.json
      - name: Installed fleet allocator
        run: rack-to-token examples/rack_fleet.json --output /tmp/fleet.json
      - name: Verify installed receipts
        run: |
          python - <<'PY'
          import json
          plan = json.load(open('/tmp/plan.json'))
          fleet = json.load(open('/tmp/fleet.json'))
          assert plan['decision'] == 'ALLOW'
          assert plan['metrics']['selected_plan_id']
          assert fleet['decision'] == 'ALLOW'
          assert fleet['unmet_tokens_per_second'] == 0.0
          PY

name: Crystallization

on:
  push:
  pull_request:

jobs:
  rack-to-token-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Compile mechanism and CLI
        run: |
          python -m py_compile src/rack_token_controller.py
          python -m py_compile src/rack_token_cli.py
      - name: Prove behavioral and failure paths
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_rack_token_controller.py
      - name: Execute fleet allocation example
        env:
          PYTHONPATH: src
        run: |
          python -m rack_token_cli examples/rack_fleet.json --output /tmp/rack-token-receipt.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/rack-token-receipt.json'))
          assert data['decision'] == 'ALLOW'
          assert data['unmet_tokens_per_second'] == 0.0
          assert 'rack-hot' not in data['assignments']
          assert set(data['assignments']).issubset({'rack-efficient', 'rack-safe'})
          assert len(data['digest']) == 64
          decisions = {row['rack_id']: row for row in data['rack_decisions']}
          assert decisions['rack-hot']['action'] == 'THERMAL_THROTTLE'
          assert decisions['rack-hot']['eligible_for_new_work'] is False
          PY

name: Crystallization

on:
  push:
  pull_request:

jobs:
  rack-to-token-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build installable wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps -w dist
          python -m pip install dist/*.whl pytest
      - name: Prove complete behavior and failure paths
        run: |
          python -m pytest -q tests/test_rack_token_controller.py tests/test_autopilot_loop.py tests/test_prometheus_adapter.py tests/test_rack_to_token_autopilot.py
      - name: Execute installed fleet allocation CLI
        run: |
          rack-to-token examples/rack_fleet.json --output /tmp/rack-token-receipt.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/rack-token-receipt.json'))
          assert data['decision'] == 'ALLOW'
          assert data['unmet_tokens_per_second'] == 0.0
          assert 'rack-hot' not in data['assignments']
          assert len(data['digest']) == 64
          PY
      - name: Execute canonical operability path
        run: python scripts/operate.py > /tmp/operate.json
      - name: Enforce crystallization manifests and truth surface
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          caps = json.loads(Path('machine/crystallization/capability-manifest.json').read_text())
          gaps = json.loads(Path('machine/crystallization/gap-matrix.json').read_text())
          assert caps['capabilities']
          assert all(item['state'] == 'WORKING' for item in caps['capabilities'])
          assert gaps['gaps'] == []
          text = Path('README.md').read_text()
          project = Path('pyproject.toml').read_text()
          legacy = Path('src/rack_to_token_autopilot.py').read_text()
          forbidden = ['Current scaffold state', 'SCAFFOLD STUB', 'scaffold_allow', 'description = "Scaffold:']
          assert all(value not in text + project + legacy for value in forbidden)
          PY

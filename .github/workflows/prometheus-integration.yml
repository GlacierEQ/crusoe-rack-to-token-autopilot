name: Prometheus Integration

on:
  push:
  pull_request:

jobs:
  prometheus-rack-telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Compile telemetry surfaces
        run: |
          python -m py_compile src/prometheus_adapter.py
          python -m py_compile src/prometheus_rack_cli.py
      - name: Prove parser failures and live HTTP scrape
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_prometheus_adapter.py
